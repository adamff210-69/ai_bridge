<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptBridge — unknown-host detection bench</title>
    <!--
      The proof bench for the sensing engine.

      Nothing here is in the extension. There is no hint, no hostname match, no
      class name worth reading: `x7f` / `q2` are the kind of names a build step
      emits and a redesign changes. If PromptBridge can capture this thread, it
      can capture anything shaped like a chat.

      Open it, press Ctrl+Shift+K, and hit "Check adapter health".
    -->
    <style>
      * { box-sizing: border-box; }
      body { margin:0; background:#0b0d12; color:#e8ecf4; font:15px/1.65 ui-sans-serif,system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
      header { padding:14px 18px; border-bottom:1px solid #1b2130; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#6b7688; }
      #stream { flex:1; overflow:auto; padding:22px 0; max-width:820px; width:100%; margin:0 auto; }
      .row { display:block; padding:14px 22px; margin:0 0 4px; }
      .row > .cap { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#67707f; margin-bottom:5px; }
      .x7f.a1 { margin-left:auto; max-width:74%; background:#1b2333; border-radius:16px 16px 4px 16px; }
      .x7f.a2 { max-width:100%; }
      pre { background:#0f1319; padding:12px; border-radius:10px; overflow:auto; font-size:13px; border:1px solid #1b2130; }
      .dock { border-top:1px solid #1b2130; padding:14px 18px 18px; background:#0e1118; }
      .q2 { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
      .m1 { flex:1; min-height:52px; background:#161b26; border:1px solid #262e3e; border-radius:20px;
            padding:13px 16px; font:inherit; color:inherit; resize:none; outline:none; }
      .m1:focus { border-color:#3d4759; }
      .s9 { width:44px; height:44px; border-radius:50%; border:1px solid #2c3546;
            background:#1d2432; color:#9aa6b8; font-size:17px; cursor:pointer; }
      .hint { max-width:820px; margin:10px auto 0; font-size:11.5px; color:#5d6675; }
    </style>
  </head>
  <body>
    <header>quill &mdash; a host PromptBridge has never seen</header>

    <div id="stream"></div>

    <div class="dock">
      <div class="q2">
        <textarea class="m1" placeholder="Message quill" aria-label="Message quill"></textarea>
        <button class="s9" aria-label="Send message">&#9650;</button>
      </div>
      <div class="hint">
        Deliberately unhelpful markup: obfuscated classes, a custom element, a
        <code>&lt;form&gt;</code> with no <code>action</code>, and a decoy search
        box that looks more like a chat input than the real one.
      </div>
    </div>

    <script>
      var turns = [
        { role: 'user', text: 'Our ingest service drops about 3% of uploads under load. Logs show ECONNRESET from the upstream provider.\n\nConstraints: must stay on BullMQ, no new infra, ship this week.' },
        { role: 'assistant', text: "The 5s socketTimeout races the 5s retry backoff, so a retry can fire while the original socket is still half-open.\n\n- Decision: exponential backoff with jitter, 100ms base\n- Decision: socketTimeout to 20s, pool cap of 64\n\n```js\nconst delay = (n) => 100 * 2 ** n + Math.random() * 100;\n```\n\nNext step: wire the stalled-event listener." },
        { role: 'user', text: 'Make the change and add a regression test.' },
        { role: 'assistant', text: 'Applied. The test fakes a socket that resets mid-flight and asserts we exhaust the backoff schedule.\n\nSuccess = the load profile stays green.' }
      ];

      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/```([\w-]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/\n\n/g, '<br><br>').replace(/\n- /g, '<br>• ');
      }

      // Each turn is a .row, and the *caption* is a sibling, not a data attribute.
      // Nothing in the markup says "user" or "assistant" to a selector.
      function render() {
        document.getElementById('stream').innerHTML = turns.map(function (t) {
          return '<div class="row"><div class="cap">' + (t.role === 'user' ? 'You' : 'quill') + '</div>' +
                 '<div class="x7f ' + (t.role === 'user' ? 'a1' : 'a2') + '">' + esc(t.text) + '</div></div>';
        }).join('');
      }
      render();

      document.querySelector('.s9').addEventListener('click', function () {
        var el = document.querySelector('.m1');
        var v = el.value.trim();
        if (!v) return;
        turns = turns.concat([
          { role: 'user', text: v },
          { role: 'assistant', text: '(bench reply) — this is the local test bench, not a model.' }
        ]);
        render();
        el.value = '';
      });

      // A decoy: a search box that is WIDER and higher on the page than the real
      // composer, so a naive "first contenteditable/textarea" heuristic picks it.
      var decoy = document.createElement('input');
      decoy.type = 'search';
      decoy.placeholder = 'Search messages';
      decoy.setAttribute('aria-label', 'Search messages');
      decoy.style.cssText = 'width:100%;padding:12px 16px;margin:0 0 14px;background:#12161f;border:1px solid #232b39;border-radius:12px;color:inherit;font:inherit';
      document.getElementById('stream').parentNode.insertBefore(decoy, document.getElementById('stream'));
    </script>
  </body>
</html>
