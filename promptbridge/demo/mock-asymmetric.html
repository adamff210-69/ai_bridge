<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptBridge — asymmetric thread bench</title>
    <!--
      The shape that breaks turn-by-turn role guessing: H A H A [A] H A.
      A model sent two messages in a row mid-thread, which no parity rule can
      survive. Live audits of real accounts find this in roughly a third of
      conversations, so the engine assigns roles across the whole thread at once
      rather than guessing each turn alone.
    -->
    <style>
      * { box-sizing:border-box; }
      body { margin:0; background:#0b0d12; color:#e8ecf4; font:15px/1.65 ui-sans-serif,system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
      header { padding:13px 18px; border-bottom:1px solid #1b2130; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:#67707f; }
      #stream { flex:1; overflow:auto; padding:20px 0; max-width:820px; width:100%; margin:0 auto; }
      .row { display:block; padding:13px 22px; }
      .row > .cap { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#67707f; margin-bottom:4px; }
      .x7f.a1 { margin-left:auto; max-width:74%; background:#1b2333; border-radius:16px 16px 4px 16px; }
      .x7f.a2 { max-width:100%; }
      pre { background:#0f1319; padding:12px; border-radius:10px; font-size:13px; border:1px solid #1b2130; }
      .dock { border-top:1px solid #1b2130; padding:14px 18px; }
      .q2 { max-width:820px; margin:0 auto; display:flex; gap:10px; }
      .m1 { flex:1; min-height:50px; background:#161b26; border:1px solid #262e3e; border-radius:20px; padding:13px 16px; font:inherit; color:inherit; }
      .s9 { width:44px; height:44px; border-radius:50%; border:1px solid #2c3546; background:#1d2432; color:#9aa6b8; }
    </style>
  </head>
  <body>
    <header>asymmetric thread &mdash; one model, two messages in a row</header>
    <div id="stream"></div>
    <div class="dock"><div class="q2">
      <textarea class="m1" placeholder="Message quill" aria-label="Message quill"></textarea>
      <button class="s9" aria-label="Send message">&#9650;</button>
    </div></div>
    <script>
      var turns = [
        { role: 'user', text: 'Can you explain why our ingest keeps resetting sockets under load?' },
        { role: 'assistant', text: 'The 5s socketTimeout races the 5s retry backoff, so a retry can fire while the original socket is still half-open. Here is the backoff you want:' },
        { role: 'user', text: 'Show the code, and keep it under ten lines.' },
        { role: 'assistant', text: '```js\nconst delay = (n) => 100 * 2 ** n;\n```' },
        { role: 'assistant', text: 'Set socketTimeout to 20s and add a stalled-event listener on the BullMQ worker.' },
        { role: 'user', text: 'Great, ship it and add a regression test for the retry exhaustion.' }
      ];
      function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/```([\w-]*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
          .replace(/\n\n/g,'<br><br>');
      }
      document.getElementById('stream').innerHTML = turns.map(function (t) {
        return '<div class="row"><div class="cap">' + (t.role === 'user' ? 'You' : 'quill') + '</div>' +
               '<div class="x7f ' + (t.role === 'user' ? 'a1' : 'a2') + '">' + esc(t.text) + '</div></div>';
      }).join('');
    </script>
  </body>
</html>
